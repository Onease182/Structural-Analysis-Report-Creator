# Owner-approved differences for the round-trip comparison.
# Only rules explicitly approved by the owner are listed here.
# Do NOT add rules without owner approval.

owner_approved:
  # Restyled conclusion headings (Heading 4 → Body Text) — owner-approved
  - description: "In-plane discontinuity conclusion restyled to Body Text"
    match_type: heading_restyle
    text_contains: "No in-plane discontinuity is present"
    original_style: "Heading 4"
    new_style: "Body Text"

  - description: "Mass irregularity conclusion restyled to Body Text"
    match_type: heading_restyle
    text_contains: "No mass irregularity is seen"
    original_style: "Heading 4"
    new_style: "Body Text"

  # Computed variant paragraphs (whole-paragraph replacement) — owner-approved
  - description: "Soft storey conclusion is a computed variant"
    match_type: computed_variant
    key: analysis.soft_storey_result

  - description: "Re-entrant corner conclusion is a computed variant"
    match_type: computed_variant
    key: analysis.reentrant_corner_result

  # T15 replaced with image placeholder — owner-approved
  - description: "T15 slab design table replaced with image placeholder"
    match_type: table_replaced_with_image
    table_index: 15
    replacement_key: figure.design.slab_sheet

  - description: "T15 table removed (replaced by image)"
    match_type: table_removed
    table_index: 15

  # T6 pending implementation — owner-approved while status is set
  - description: "T6 load assessment table pending code-built implementation"
    match_type: table_pending
    table_index: 6
    status: pending_implementation
    phase: "Phase 3b"

  # Loop table structure changes — owner-approved
  - description: "Loop table data rows replaced with template rows"
    match_type: loop_table
    table_indices: [9, 10, 11, 14]

  # D1: NBC edition spacing — one exact-text difference for para 179
  - description: "D1: NBC edition typo corrected (NBC105:2025 → NBC 105:2025)"
    match_type: exact_text
    old_fragment: "NBC105:2025 clause 7.3"
    new_fragment: "NBC 105:2025 clause 7.3"

  # D2: Consultant name typo — one exact-text difference for the paragraph
  - description: "D2: Consultant name typo corrected (Civira X → CivoraX Infra)"
    match_type: exact_text
    old_fragment: "Civira X"
    new_fragment: "CivoraX Infra"

  # Clause changes — exact old-to-new pairs, owner-approved.
  # The comparison verifies that after replacing old with new the rest of
  # the text is IDENTICAL.
  - description: "Clause 2.1 reference updated (item 208)"
    match_type: clause_change_exact
    old: "According to NBC105:2020, The material should be taken as per Cl.2.1."
    new: "According to NBC 105:2025, The material should be taken as per Annex A, Cl. 2.1."

  - description: "Clause 3.2.1 reference updated (item 413)"
    match_type: clause_change_exact
    old: "As per Clause 3.2.1 of NBC 105:2025"
