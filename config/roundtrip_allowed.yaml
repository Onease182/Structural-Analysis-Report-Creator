# Owner-approved differences for the round-trip comparison.
# Any difference matching a rule here is classified as "owner_approved"
# in docs/roundtrip_diff.csv. All other differences are "unexpected".

owner_approved:
  # Restyled conclusion headings (Heading 4 → Body Text)
  - description: "In-plane discontinuity conclusion restyled to Body Text"
    match_type: heading_restyle
    text_contains: "No in-plane discontinuity is present"
    original_style: "Heading 4"
    new_style: "Body Text"

  - description: "Mass irregularity conclusion restyled to Body Text"
    match_type: heading_restyle
    text_contains: "No mass irregularity is seen"
    original_style: "Heading 4"
    new_style: "Body Text"

  # Computed variant paragraphs (whole-paragraph replacement)
  - description: "Soft storey conclusion is a computed variant"
    match_type: computed_variant
    key: analysis.soft_storey_result

  - description: "Re-entrant corner conclusion is a computed variant"
    match_type: computed_variant
    key: analysis.reentrant_corner_result

  - description: "Foundation support condition is computed"
    match_type: computed_variant
    key: foundation.support_condition

  # NBC 105:2025 clause changes
  - description: "Clause references updated to NBC 105:2025 values"
    match_type: clause_change
    patterns:
      - "5.5.1.2"  # → 5.4.1.2
      - "5.5.1.4"  # → 5.4.1.4
      - "5.5.1.5"  # → 5.4.1.5
      - "5.5.2.2"  # → 5.4.2.3
      - "5.5.2.3"  # → 5.4.2.4
      - "5.5.2.4"  # → 5.4.2.5
      - "2.1"      # → Annex A, Cl. 2.1
      - "3.6.1"    # → 3.6.1 (owner-mapped)
      - "5.5"      # → 5.4
      - "5.5.2.1"  # → 5.4.2.1
      - "5.6.3"    # → 5.5.3
      - "NBC 105:2020"
      - "NBC 105:2077"

  # T15 replaced with image placeholder
  - description: "T15 slab design table replaced with image placeholder"
    match_type: table_replaced_with_image
    table_index: 15
    replacement_key: figure.design.slab_sheet

  # T15 table count change
  - description: "T15 table removed (replaced by image)"
    match_type: table_removed
    table_index: 15

  # T6 pending implementation (still contains sample data)
  - description: "T6 load assessment table pending code-built implementation"
    match_type: table_pending
    table_index: 6
    status: pending_implementation
    phase: "Phase 3b"

  # Loop table structure changes (data rows → loop template)
  - description: "Loop table data rows replaced with template rows"
    match_type: loop_table
    table_indices: [9, 10, 11, 14]

  # Sentence template replacements (sub-paragraph placeholders)
  - description: "Paragraphs with sentence templates have variable tokens replaced"
    match_type: sentence_template

  # Table cell placeholders
  - description: "Table cells with variable values replaced by placeholders"
    match_type: table_cell_placeholder
